[extend]
useDefault = true

[allowlist]
description = "Ignore generated and dependency directories that are gitignored locally, and the local .env which is never committed."
paths = [
    '''\.venv/''',
    '''venv/''',
    '''node_modules/''',
    '''\.git/''',
    '''\.mypy_cache/''',
    '''\.ruff_cache/''',
    '''\.pytest_cache/''',
    '''dist/''',
    '''build/''',
    '''^\.env$''',
    '''\.env\..*''',
]
